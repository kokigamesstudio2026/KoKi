<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snake</title>
<meta name="description" content="Classic Snake, rebuilt for your thumb. Swipe to steer. Beat my score.">
<!-- Google Ad Placement API: replace this placeholder with the provider's approved setup after AdSense approval. -->
<meta property="og:title" content="Snake">
<meta property="og:description" content="Swipe to steer. Eat. Grow. Don't hit anything.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3b3a;--ink:#0b2524;--cream:#fff4dc;--coral:#ff6b57;--coral-d:#c2412f;--gold:#ffd166;--glass:rgba(11,37,36,.84)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:var(--bg);color:var(--cream);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:16px;right:70px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:18px;align-items:baseline;pointer-events:none}
#score{font-size:48px;font-weight:700;line-height:1}
#best{font-size:16px;opacity:.85}
#mute{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:42px;height:42px;border-radius:50%;border:0;background:var(--glass);color:var(--cream);font-size:20px;z-index:5}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--glass);text-align:center;z-index:4}
.ov.hide{display:none}
h1{font-size:clamp(56px,18vw,96px);line-height:.9;margin:0;font-weight:700;color:var(--coral);text-shadow:0 5px 0 var(--ink)}
h2{font-size:clamp(24px,7vw,34px);margin:0;max-width:18ch;line-height:1.15;font-weight:700}
p{margin:0;max-width:32ch;line-height:1.4}
.big{font-family:inherit;font-weight:700;font-size:20px;padding:14px 30px;border:0;border-radius:18px;background:var(--coral);color:#fff;box-shadow:0 6px 0 var(--coral-d);min-width:230px}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--coral-d)}
.big.alt{background:var(--cream);color:var(--ink);box-shadow:0 6px 0 #b9ad8f}
#fscore{font-size:88px;font-weight:700;line-height:1;color:var(--gold)}
#frank{font-size:22px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--cream);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:15px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="score">0</div><div id="best"></div></div>
<button id="mute" aria-label="Mute">🔊</button>

<div id="start" class="ov">
  <h1>Snake</h1>
  <p id="beatMsg"></p>
  <p>Swipe anywhere to steer, or use the arrow keys. Gold apples are worth 5 but vanish fast.</p>
  <button id="go" class="big">Start</button>
  <p id="adStatus" aria-live="polite">Ads are not configured yet. You can still play.</p>
  <p id="bestLine"></p>
</div>

<div id="over" class="ov hide">
  <h2 id="failMsg"></h2>
  <div id="fscore">0</div>
  <div id="frank"></div>
  <p id="fdetail"></p>
  <p id="rewardStatus" aria-live="polite"></p>
  <button id="continueAd" class="big">Watch Ad to Continue</button>
  <button id="share" class="big">Share result</button>
  <button id="again" class="big alt">Try again</button>
</div>
<div id="toast"></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const N = 17;
let W, H, DPR, cell, ox, oy;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const top = 70 + (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0);
  cell = Math.floor(Math.min(W - 20, H - top - 20) / N);
  ox = Math.floor((W - cell * N) / 2); oy = Math.floor(top + (H - top - cell * N) / 2);
}
addEventListener('resize', resize); addEventListener('orientationchange', resize); resize();
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

const st = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const beat = +new URLSearchParams(location.search).get('beat') || 0;

// ---------- audio ----------
let ac, muted = st.get('sn_mute', false);
function tone(f, d, type = 'square', v = .07, slide = 0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(t + d);
  } catch (e) {}
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
function setMute() { $('mute').textContent = muted ? '🔇' : '🔊'; }
$('mute').onclick = e => { e.stopPropagation(); muted = !muted; st.set('sn_mute', muted); setMute(); };
setMute();

const FAILS = ['You bit yourself. Classic.', 'The wall was there the whole time', 'Snake? Snake?! SNAAAKE!', 'That was a cry for help',
  'Ssssorry, not ssssorry', 'Should have turned earlier', 'The apple was not worth it 🍎'];
const RANKS = [[0, 'Earthworm 🪱'], [10, 'Garden Snake'], [25, 'Python 🐍'], [45, 'Anaconda 👑']];
const rankOf = s => RANKS.reduce((r, x) => s >= x[0] ? x[1] : r, RANKS[0][1]);

// ---------- state ----------
let S, paused = false, last = performance.now();
let continueUsed = false;
let adBusy = false;

// Provider adapter. This deliberately does not simulate an ad.
// Connect this to the approved Google Ad Placement API setup when publisher/ad
// configuration is available. A reward is granted only from adViewed().
const AD_PROVIDER_CONFIGURED = typeof window.adBreak === 'function';
function runOpeningAd(onFinished) {
  if (!AD_PROVIDER_CONFIGURED) {
    $('adStatus').textContent = 'Ad provider not configured. Starting game without an ad.';
    onFinished();
    return;
  }
  let finished = false;
  const finish = () => { if (finished) return; finished = true; onFinished(); };
  try {
    window.adBreak({
      type: 'start',
      name: 'snake_game_start',
      beforeAd: () => { paused = true; },
      afterAd: () => { paused = false; },
      adBreakDone: () => { paused = false; finish(); }
    });
  } catch (err) {
    paused = false;
    $('adStatus').textContent = 'Ad could not be shown. Starting game without an ad.';
    finish();
  }
}
function runRewardedAd(onReward, onUnavailable) {
  if (!AD_PROVIDER_CONFIGURED) {
    onUnavailable('Rewarded ads are not configured yet. No continue reward was granted.');
    return;
  }
  let settled = false;
  const settleUnavailable = msg => {
    if (settled) return;
    settled = true;
    adBusy = false;
    onUnavailable(msg || 'Ad was not completed. No continue reward was granted.');
  };
  try {
    window.adBreak({
      type: 'reward',
      name: 'snake_continue',
      beforeAd: () => { paused = true; adBusy = true; },
      afterAd: () => { paused = false; },
      beforeReward: showAdFn => {
        // This is the provider's opt-in prompt. The provider controls when showAdFn
        // is valid; invoke it only after the player accepts the reward prompt.
        const accepted = window.confirm('Watch an ad to continue this run?');
        if (accepted) showAdFn();
        else settleUnavailable('Ad declined. No continue reward was granted.');
      },
      adDismissed: () => settleUnavailable('Ad closed before completion. No continue reward was granted.'),
      adViewed: () => {
        if (settled) return;
        settled = true;
        adBusy = false;
        paused = false;
        onReward();
      },
      adBreakDone: placementInfo => {
        if (!settled) settleUnavailable('No rewarded ad was shown. No continue reward was granted.');
      }
    });
  } catch (err) {
    settleUnavailable('Ad provider error. No continue reward was granted.');
  }
}
const rc = () => ({ x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 });
function freeCell() { let c, tries = 0; do { c = rc(); tries++; } while (tries < 500 && (S.snake.some(s => s.x === c.x && s.y === c.y) || (S.apple && S.apple.x === c.x && S.apple.y === c.y) || (S.gold && S.gold.x === c.x && S.gold.y === c.y))); return c; }
function reset() {
  const m = N >> 1;
  S = { state: 'play', snake: [{ x: m, y: m }, { x: m - 1, y: m }, { x: m - 2, y: m }], dir: { x: 1, y: 0 }, q: [], apple: null, gold: null,
    score: 0, eaten: 0, acc: 0, goldT: 0, shake: 0, parts: [], pops: [], dt: 0, msg: '' };
  S.apple = freeCell();
}
reset(); S.state = 'idle';

function turn(x, y) {
  if (S.state !== 'play') return;
  const ref = S.q.length ? S.q[S.q.length - 1] : S.dir;
  if ((x === -ref.x && y === -ref.y) || (x === ref.x && y === ref.y) || S.q.length > 2) return;
  S.q.push({ x, y });
}
let po = null;
cv.addEventListener('pointerdown', e => { if (paused) { paused = false; return; } po = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointermove', e => {
  if (!po) return; const dx = e.clientX - po.x, dy = e.clientY - po.y;
  if (Math.hypot(dx, dy) < 22) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  po = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', () => po = null);
addEventListener('keydown', e => {
  const k = e.key, m = { ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0], ArrowRight: [1, 0], d: [1, 0], D: [1, 0], ArrowUp: [0, -1], w: [0, -1], W: [0, -1], ArrowDown: [0, 1], s: [0, 1], S: [0, 1] }[k];
  if (m) { e.preventDefault(); turn(m[0], m[1]); return; }
  if (k === ' ' || k === 'Enter') {
    e.preventDefault();
    if (!$('start').classList.contains('hide')) $('go').click();
    else if (!$('over').classList.contains('hide')) $('again').click();
    else if (paused) paused = false; else if (S.state === 'play') paused = true;
  }
});
const pause = () => { if (S && S.state === 'play') paused = true; };
document.addEventListener('visibilitychange', () => document.hidden && pause());
addEventListener('blur', pause);

function burst(x, y, c) {
  for (let i = 0; i < 14; i++) { const a = Math.random() * 6.28, s = 60 + Math.random() * 180; S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5, c }); }
}
const cx = g => ox + g * cell + cell / 2;
const cy = g => oy + g * cell + cell / 2;

function tick() {
  const s = S, d = s.q.shift() || s.dir; s.dir = d;
  const h = { x: s.snake[0].x + d.x, y: s.snake[0].y + d.y };
  const eatA = h.x === s.apple.x && h.y === s.apple.y, eatG = s.gold && h.x === s.gold.x && h.y === s.gold.y;
  const body = eatA || eatG ? s.snake : s.snake.slice(0, -1);
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some(b => b.x === h.x && b.y === h.y)) { die(); return; }
  s.snake.unshift(h);
  if (eatA) {
    s.score++; s.eaten++; burst(cx(h.x), cy(h.y), '#ff5b4d'); tone(520 + Math.min(s.score, 30) * 12, .09); buzz(10);
    s.apple = freeCell();
    if (!s.gold && s.eaten % 6 === 0) { s.gold = freeCell(); s.goldT = 6; }
  } else if (eatG) {
    s.score += 5; s.gold = null; burst(cx(h.x), cy(h.y), '#ffd166'); tone(880, .12, 'triangle', .1); setTimeout(() => tone(1320, .15, 'triangle', .1), 90); buzz(25);
    s.pops.push({ txt: '+5', x: cx(h.x), y: cy(h.y), life: 1 });
  } else s.snake.pop();
}
function die() {
  const s = S; s.state = 'dead'; s.shake = 1; s.dt = 0; s.msg = FAILS[(Math.random() * FAILS.length) | 0];
  tone(200, .5, 'sawtooth', .14, -150); buzz([60, 40, 140]);
  s.snake.forEach(b => burst(cx(b.x), cy(b.y), '#ffb199'));
}
function update(dt) {
  const s = S;
  s.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }); s.parts = s.parts.filter(p => p.life > 0);
  s.pops.forEach(p => { p.y -= 40 * dt; p.life -= dt; }); s.pops = s.pops.filter(p => p.life > 0);
  s.shake = Math.max(0, s.shake - dt * 2.5);
  if (s.state === 'dead') { s.dt += dt; if (s.dt > 1) gameOver(); return; }
  if (s.state !== 'play') return;
  if (s.gold) { s.goldT -= dt; if (s.goldT <= 0) s.gold = null; }
  s.acc += dt * 1000;
  const iv = Math.max(65, 140 - s.score * 1.8);
  while (s.acc >= iv && s.state === 'play') { s.acc -= iv; tick(); }
}
function gameOver() {
  const s = S; s.state = 'over';
  let best = st.get('sn_best', 0); const nb = s.score > best; if (nb) { best = s.score; st.set('sn_best', best); }
  s.res = { sc: s.score, best, rank: rankOf(s.score), len: s.snake.length };
  $('failMsg').textContent = s.msg; $('fscore').textContent = s.score; $('frank').textContent = s.res.rank;
  let d = `Length ${s.snake.length}. ${nb ? 'New best! 🎉' : 'Best: ' + best}.`;
  if (beat) d += s.score > beat ? ` You beat your friend's ${beat}!` : ` Your friend's ${beat} still stands.`;
  $('fdetail').textContent = d;
  $('rewardStatus').textContent = continueUsed ? 'Continue already used this run.' : '';
  $('continueAd').disabled = continueUsed;
  $('continueAd').textContent = continueUsed ? 'Continue Used' : 'Watch Ad to Continue';
  $('over').classList.remove('hide');
}

// ---------- drawing ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function draw() {
  const s = S; if (!s) return;
  ctx.fillStyle = '#0f3b3a'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (s.shake > 0) ctx.translate((Math.random() - .5) * s.shake * 12, (Math.random() - .5) * s.shake * 12);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { ctx.fillStyle = (x + y) % 2 ? '#14504d' : '#175a56'; ctx.fillRect(ox + x * cell, oy + y * cell, cell, cell); }
  ctx.strokeStyle = '#fff4dc'; ctx.globalAlpha = .5; ctx.lineWidth = 3; ctx.strokeRect(ox - 1.5, oy - 1.5, cell * N + 3, cell * N + 3); ctx.globalAlpha = 1;
  const t = performance.now() / 1000;
  const a = s.apple; ctx.fillStyle = '#ff5b4d'; ctx.beginPath(); ctx.arc(cx(a.x), cy(a.y) + 1, cell * .36, 0, 7); ctx.fill();
  ctx.fillStyle = '#7bd88f'; ctx.beginPath(); ctx.ellipse(cx(a.x) + cell * .1, cy(a.y) - cell * .36, cell * .12, cell * .07, -.6, 0, 7); ctx.fill();
  if (s.gold) {
    const g = s.gold, k = 1 + Math.sin(t * 9) * .08;
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(cx(g.x), cy(g.y), cell * .42 * k, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff4dc'; ctx.beginPath(); ctx.arc(cx(g.x) - cell * .12, cy(g.y) - cell * .12, cell * .1, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd166'; ctx.fillRect(ox, oy + cell * N + 8, cell * N * Math.max(0, s.goldT / 6), 5);
  }
  const L = s.snake.length, dead = s.state === 'dead' && Math.floor(s.dt * 8) % 2;
  for (let i = L - 1; i >= 0; i--) {
    const b = s.snake[i], f = i / Math.max(1, L - 1);
    ctx.fillStyle = dead ? '#fff4dc' : `rgb(${255 - f * 0 | 0},${(107 + f * 96) | 0},${(87 - f * 0 + f * 16) | 0})`;
    const pad = cell * (.06 + f * .1); rr(ox + b.x * cell + pad, oy + b.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * .3); ctx.fill();
  }
  const h = s.snake[0], d = s.dir, ex = -d.y, ey = d.x;
  ctx.fillStyle = '#fff'; for (const sd of [-1, 1]) { ctx.beginPath(); ctx.arc(cx(h.x) + d.x * cell * .18 + ex * sd * cell * .2, cy(h.y) + d.y * cell * .18 + ey * sd * cell * .2, cell * .13, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#0b2524'; for (const sd of [-1, 1]) { ctx.beginPath(); ctx.arc(cx(h.x) + d.x * cell * .24 + ex * sd * cell * .2, cy(h.y) + d.y * cell * .24 + ey * sd * cell * .2, cell * .06, 0, 7); ctx.fill(); }
  s.parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }); ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = '700 28px Fredoka, system-ui, sans-serif';
  s.pops.forEach(p => { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = '#ffd166'; ctx.fillText(p.txt, p.x, p.y); }); ctx.globalAlpha = 1;
  ctx.restore();
  if (paused) { ctx.fillStyle = 'rgba(11,37,36,.7)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff4dc'; ctx.font = '700 30px Fredoka, system-ui, sans-serif'; ctx.fillText('Paused. Tap to resume', W / 2, H / 2); }
  $('score').textContent = s.state === 'idle' ? '' : s.score;
  $('best').textContent = s.state === 'idle' ? '' : 'Best ' + Math.max(st.get('sn_best', 0), s.score);
}
function loop(n) {
  const dt = Math.min(.05, (n - last) / 1000); last = n;
  if (!paused) update(dt);
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- UI ----------
const best0 = st.get('sn_best', 0);
$('bestLine').textContent = best0 ? 'Best: ' + best0 : '';
if (beat) $('beatMsg').textContent = `Your friend scored ${beat}. Can you beat it?`;
function beginRunAfterAd() {
  $('start').classList.add('hide');
  $('over').classList.add('hide');
  $('rewardStatus').textContent = '';
  continueUsed = false;
  reset();
  tone(1, .01, 'sine', .001);
}
function startRun() {
  if (adBusy) return;
  $('go').disabled = true;
  runOpeningAd(() => {
    $('go').disabled = false;
    beginRunAfterAd();
  });
}
function continueRunAfterReward() {
  // Preserve score/eaten count, but place a fresh short snake safely on the board.
  // This avoids restoring the collision state that ended the run.
  const s = S, m = N >> 1;
  s.snake = [{ x: m, y: m }, { x: m - 1, y: m }, { x: m - 2, y: m }];
  s.dir = { x: 1, y: 0 };
  s.q = [];
  s.apple = freeCell();
  s.gold = null;
  s.goldT = 0;
  s.acc = 0;
  s.dt = 0;
  s.shake = 0;
  s.state = 'play';
  continueUsed = true;
  paused = false;
  $('over').classList.add('hide');
  $('rewardStatus').textContent = '';
  tone(620, .12, 'triangle', .08);
}
$('go').onclick = startRun;
$('again').onclick = startRun;
$('continueAd').onclick = () => {
  if (S.state !== 'over' || continueUsed || adBusy) return;
  $('continueAd').disabled = true;
  $('rewardStatus').textContent = 'Waiting for ad provider…';
  runRewardedAd(
    () => continueRunAfterReward(),
    message => {
      $('continueAd').disabled = continueUsed;
      $('rewardStatus').textContent = message;
    }
  );
};

function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2400); }
function card(r) {
  const c = document.createElement('canvas'); c.width = c.height = 600; const x = c.getContext('2d');
  x.fillStyle = '#0f3b3a'; x.fillRect(0, 0, 600, 600);
  for (let i = 0; i < 14; i++) { x.fillStyle = `rgb(255,${107 + i * 7},${87 + i})`; x.beginPath(); x.roundRect ? x.roundRect(60 + i * 32, 520 - Math.abs(Math.sin(i * .6)) * 50, 28, 28, 9) : x.rect(60 + i * 32, 520, 28, 28); x.fill(); }
  x.textAlign = 'center'; x.fillStyle = '#ff6b57'; x.font = '700 64px Fredoka, system-ui, sans-serif'; x.fillText('Snake', 300, 90);
  x.fillStyle = '#ffd166'; x.font = '700 160px Fredoka, system-ui, sans-serif'; x.fillText(r.sc, 300, 270);
  x.fillStyle = '#fff4dc'; x.font = '700 38px Fredoka, system-ui, sans-serif'; x.fillText(r.rank, 300, 330);
  x.font = '500 24px Fredoka, system-ui, sans-serif'; x.fillText(`Length ${r.len}  ·  Best ${r.best}  ·  Beat me!`, 300, 380); return c;
}
$('share').onclick = () => {
  const r = S.res, url = location.origin + location.pathname + '?beat=' + r.sc;
  const text = `I scored ${r.sc} on Snake. Beat me 👉 ${url}`;
  card(r).toBlob(async b => {
    try {
      const f = new File([b], 'snake.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], text });
      else if (navigator.share) await navigator.share({ text });
      else throw 0;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      try { await navigator.clipboard.writeText(text); toast('Copied. Paste it anywhere.'); } catch (_) { toast(text); }
    }
  });
};
})();
</script>
</body>
</html>
